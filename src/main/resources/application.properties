# ===== application.properties =====
# Archivo de configuración de Spring Boot. Spring lo lee al arrancar.
# Los valores de aquí se pueden usar en el código con @Value("${clave}").

# Nombre de la aplicación (solo informativo)
spring.application.name=pokedex

# Puerto donde corre la web: http://localhost:8080
server.port=8080

# Desactiva el caché de Thymeleaf: al editar un .html se ve el cambio sin reiniciar
spring.thymeleaf.cache=false

# URL base de la API pública de Pokémon (la usa PokemonService)
pokeapi.base-url=https://pokeapi.co/api/v2

# Cuántas tarjetas se muestran por "página" (la usa PokemonViewController)
pokedex.page-size=30
