<!DOCTYPE html>
<!--
  VISTA (V de MVC): index.html es una plantilla Thymeleaf.
  Thymeleaf lee los atributos "th:..." en el servidor, los reemplaza con datos reales
  y envía al navegador un HTML normal.

  Conexión con la arquitectura:
  1. Controlador MVC (PokemonViewController.java): Intercepta la ruta "/", obtiene la lista de
     la PokeAPI a través del PokemonService, y le entrega a este HTML las variables
     "pokemones", "pagina" y "error".
  2. Controlador REST (PokemonRestController.java): app.js consumirá los endpoints "/api/pokemon"
     desde aquí para la paginación y búsqueda sin recargar la página.
  3. Frontend: /css/styles.css maneja el diseño y /js/app.js controla los eventos del usuario.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokédex</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- ============ ENCABEZADO + BUSCADOR ============ -->
<header class="encabezado">
    <div class="encabezado__titulos">
        <h1 class="titulo">Pokédex</h1>
        <!-- CAMBIO VISUAL: Agregamos un pequeño subtítulo para darle más personalidad a la UI -->
        <p class="subtitulo-header">Encuentra a tu compañero Pokémon</p>
    </div>

    <label class="buscador" for="buscador">
        <span class="buscador__etiqueta">Buscar por nombre o número</span>
        <input id="buscador" type="search" placeholder="Ej. pikachu o 25" autocomplete="off">
    </label>
    <p id="estado" class="estado" role="status" aria-live="polite"></p>
</header>

<main class="contenido">
    <p class="alerta" th:if="${error}" th:text="${error}">Error</p>

    <!-- ============ GRILLA DE TARJETAS ============ -->
    <section id="grilla" class="grilla" aria-label="Lista de Pokémon">
        <article class="tarjeta" th:each="p : ${pokemones}" th:attr="data-id=${p.id}" tabindex="0">
            <span class="tarjeta__numero" th:text="'#' + ${#numbers.formatInteger(p.id, 3)}">#001</span>
            <!-- CAMBIO VISUAL: Agregamos un pequeño contenedor para la imagen para evitar que se deforme -->
            <div class="tarjeta__contenedor-img">
                <img class="tarjeta__imagen" th:src="${p.imageUrl}" th:alt="${p.name}" loading="lazy" alt="">
            </div>
            <h2 class="tarjeta__nombre" th:text="${#strings.capitalize(p.name)}">Nombre</h2>
        </article>
    </section>

    <div class="centrado">
        <button id="btn-mas" class="boton" type="button"
                th:attr="data-offset=${pagina != null ? pagina.siguienteOffset : 0}"
                th:classappend="${pagina == null or !pagina.hayMas} ? 'oculto' : ''">
            Cargar más
        </button>
    </div>
</main>

<!-- ============ POPUP (MODAL) DE DETALLE ============ -->
<div id="modal" class="modal oculto" role="dialog" aria-modal="true" aria-labelledby="modal-nombre">
    <div class="modal__panel">
        <button id="btn-regresar" class="boton boton--regresar" type="button">← Regresar</button>
        <p id="modal-error" class="alerta oculto"></p>

        <div id="modal-cuerpo">
            <img id="modal-imagen" class="modal__imagen" src="" alt="">
            <p id="modal-numero" class="modal__numero"></p>
            <h2 id="modal-nombre" class="modal__nombre"></h2>
            <div id="modal-tipos" class="tipos"></div>
            <p id="modal-descripcion" class="modal__descripcion"></p>

            <dl class="datos">
                <div><dt>Altura</dt><dd id="modal-altura"></dd></div>
                <div><dt>Peso</dt><dd id="modal-peso"></dd></div>
                <div><dt>Exp. base</dt><dd id="modal-exp"></dd></div>
                <div><dt>Habilidades</dt><dd id="modal-habilidades"></dd></div>
            </dl>

            <h3 class="subtitulo">Estadísticas base</h3>
            <div id="modal-stats" class="stats"></div>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
